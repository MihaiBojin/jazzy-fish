# .pre-commit-config.yaml
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      # keep-sorted start
      - id: check-ast
      - id: check-docstring-first
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: trailing-whitespace
      # keep-sorted end

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        # The package (and its mypy config) lives under python/, but pre-commit
        # runs hooks from the repo root, so point mypy at the config explicitly.
        # Setting args replaces the hook's defaults, so repeat them here:
        # third-party stubs are not installed in the hook's isolated env.
        args:
          [
            "--ignore-missing-imports",
            "--scripts-are-modules",
            "--config-file",
            "python/pyproject.toml",
          ]

  - repo: https://gitlab.com/bmares/check-json5
    rev: v1.0.1
    hooks:
      - id: check-json5

  - repo: https://github.com/google/keep-sorted
    rev: v0.9.1
    hooks:
      - id: keep-sorted

  - repo: local
    hooks:
      - id: pre-push-hook
        name: Pre-push hook
        entry: python/scripts/pre-push.bash
        language: script
        stages: [pre-push]
