# The whole main pipeline: test, then tag a merged version bump, then publish
# that tag. One workflow rather than three chained together, so the ordering is
# job dependencies rather than one workflow observing another.
#
# The filename is load-bearing and cannot be changed casually: PyPI and
# test.PyPI each register a trusted publisher against 'cicd.yml', and OIDC
# uploads stop working the moment it disagrees. Renaming means registering the
# new name on both indexes first.
name: CI/CD

# Default to read-only. Jobs that need more say so explicitly, and naming any
# permission in a job drops these defaults rather than adding to them.
permissions:
  contents: read

# One release pipeline at a time. Two merges in quick succession would otherwise
# race the tag job. Never cancel: a half-finished publish is worse than a queue.
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

on:
  # Test pull requests, including stacks; tag and publish are skipped.
  pull_request:
  # Test, and release when the version has changed
  push:
    branches:
      - main

jobs:
  lint-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        working-directory: python
        # --locked fails the build on a stale uv.lock, rather than quietly
        # resolving something the lock file never described
        run: uv sync --all-extras --locked

      - name: Run linters
        working-directory: python
        run: uv run pre-commit run --all-files

      - name: Install the release tools
        uses: releasetools/cli@3a6e7e874ce96f8782143ddaa380da57ebc597d8 # v0.4.0

      - name: Run tests
        working-directory: python
        run: uv run pytest tests

  # Tags the commit when pyproject.toml names a version that has no tag yet.
  # 'needs: lint-test' is the point: a tag is far more awkward to retract than
  # a failed build is to fix, so nothing is tagged until the tests pass.
  tag:
    needs: lint-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      # Push the tag
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install the release tools
        uses: releasetools/cli@3a6e7e874ce96f8782143ddaa380da57ebc597d8 # v0.4.0

      - name: Tag the release
        id: tag
        working-directory: python
        run: echo "tag=$(scripts/tag-release.bash)" >>"$GITHUB_OUTPUT"

      - name: Report
        # Through env rather than ${{ }} inside the script: this job holds
        # contents: write, and the tag traces back to the version field in
        # pyproject.toml. git accepts a tag name containing a command
        # substitution, so interpolating it into a shell body is avoidable risk.
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ -n "$TAG" ]; then
            echo "Tagged $TAG" >>"$GITHUB_STEP_SUMMARY"
          else
            echo "No version change; nothing to release." >>"$GITHUB_STEP_SUMMARY"
          fi

  publish:
    needs: tag
    # Empty when the version was already tagged, i.e. an ordinary merge
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      # Mints the OIDC token that PyPI exchanges for a short-lived upload
      # token. Naming any permission drops the defaults, so 'contents: read'
      # has to be restated for the checkout.
      id-token: write
      contents: read

    steps:
      - name: Checkout the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.tag.outputs.tag }}
          # git::assert_tag_version reads the tags at HEAD, which a checkout of
          # a ref does not fetch on its own
          fetch-tags: true

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install the release tools
        uses: releasetools/cli@3a6e7e874ce96f8782143ddaa380da57ebc597d8 # v0.4.0

      - name: Check the tag matches the project version
        working-directory: python
        run: rt git::assert_tag_version "$(uv version --short)"

      - name: Build
        working-directory: python
        run: uv build

      # Writes a Sigstore-signed PEP 740 attestation next to each dist, signed
      # with this workflow's OIDC identity; 'uv publish' uploads them with the
      # dists. Both indexes trust the same identity, so one signature serves
      # test.PyPI and PyPI.
      - name: Attest
        working-directory: python
        run: uvx pypi-attestations@0.0.30 sign dist/*

      # No tokens: PyPI and test.PyPI each exchange this workflow's OIDC
      # identity for a short-lived upload token. 'always' rather than the
      # default 'automatic' so a missing or misconfigured trusted publisher
      # fails loudly instead of falling back to looking for credentials.
      - name: Publish package to test repository
        working-directory: python
        run: uv publish --index testpypi --trusted-publishing always

      - name: Publish package
        working-directory: python
        run: uv publish --trusted-publishing always

      - name: Verify package install from PyPI
        working-directory: python
        run: scripts/verify-publish.bash

      # Runs after the install check, which waits for PyPI to serve the files.
      - name: Verify attestations on PyPI
        working-directory: python
        run: |
          for f in dist/*.whl dist/*.tar.gz; do
            uvx pypi-attestations@0.0.30 verify pypi \
              --repository "https://github.com/$GITHUB_REPOSITORY" "pypi:${f#dist/}"
          done

  # Publishing to PyPI leaves the GitHub side of a release bare: a tag and
  # nothing else. This turns each tag into a release whose notes are built from
  # the pull requests merged since the previous one, so what changed between two
  # versions is visible without reading the commit log.
  #
  # A separate job to keep 'publish' scoped to 'contents: read'; writing a
  # release needs 'contents: write'.
  github-release:
    needs: [tag, publish]
    # Redundant with the skipped 'publish' it depends on, but stated so the
    # condition for running is readable in one place
    if: needs.tag.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # No checkout: gh talks to the API, and GH_REPO tells it which repository.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.tag.outputs.tag }}
        # --verify-tag refuses to invent a tag that is not on the remote, so a
        # half-finished release cannot leave a release pointing at nothing.
        run: |
          gh release create "$TAG" --generate-notes --verify-tag
          echo "Created release $TAG" >>"$GITHUB_STEP_SUMMARY"
