[project]
name = 'jazzy_fish'
license = "Apache-2.0"
description = "Generate sufficiently-large, unique, human-friendly identifiers, represented as English-language phrases."
keywords = [
    "jazzyfish",
    "unique",
    "human-friendly",
    "identifiers",
    "encoder",
    "decoder",
]
readme = { "file" = "README.md", "content-type" = "text/markdown" }
authors = [
    { name = "Mihai Bojin", email = "557584+MihaiBojin@users.noreply.github.com" },
]
dynamic = ["version"]
dependencies = []
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
] # https://pypi.org/classifiers/

[project.optional-dependencies]
cli = [
    # keep-sorted start
    "duckdb==1.5.5",
    # duckdb requires numpy to register the Python UDFs used by generate-wordlists
    "numpy==2.5.1",
    # keep-sorted end
]
dev = [
    # keep-sorted start
    "build==1.5.0",
    "pre-commit==4.6.1",
    "pytest==9.1.1",
    "twine==6.2.0",
    "wheel-inspect==1.8.0",
    "wheel==0.47.0",
    # keep-sorted end
]

[project.urls]
"Bug reports" = "https://github.com/jazzy-fish/jazzy-fish/issues/new"
"Documentation" = "https://github.com/jazzy-fish/jazzy-fish/blob/main/python/README.md"
"Source" = "https://github.com/jazzy-fish/jazzy-fish"

[project.scripts]
clean-dictionary = "jazzy_fish_tools.clean_dictionary:main"
generate-wordlists = "jazzy_fish_tools.generate_wordlists:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# https://git-scm.com/docs/gitignore#_pattern_format
exclude = [
    # keep-sorted start
    ".env",
    ".pypirc",
    "Dockerfile",
    "Makefile",
    "scripts/**",
    "tests/**",
    # keep-sorted end

    # If you want to include any scripts, list them below
    # keep-sorted start
    "!scripts/show-stats.bash",
    # keep-sorted end
]

[tool.hatch.build.targets.wheel]
packages = ["src/jazzy_fish", "src/jazzy_fish_tools"]

[tool.hatch.envs.venv]
type = "virtual"

[tool.hatch.version]
path = "./VERSION"
pattern = "(?P<version>.+)"

[tool.mypy]
# keep-sorted start
check_untyped_defs = true
disallow_untyped_calls = true
namespace_packages = false
pretty = true
show_column_numbers = true
show_error_codes = true
warn_no_return = false
warn_unused_ignores = true
# keep-sorted end

# Add per-package mypy configurations, if needed
#[[tool.mypy.overrides]]
#module = '[NAME].*'

[tool.ruff.lint]
# Pin the rule set explicitly. Ruff's implicit defaults have widened over
# releases: upgrading the hook from 0.4 to 0.16 turned on hundreds of rules at
# once and surfaced 94 findings in code that had not changed. Stating the
# policy here means a ruff upgrade is a tooling bump, not a silent change to
# what counts as an error. Widen deliberately, not by upgrade.
select = ["E4", "E7", "E9", "F"]
