[project]
name = 'jazzy_fish'
license = "Apache-2.0"
description = "Generate sufficiently-large, unique, human-friendly identifiers, represented as English-language phrases."
keywords = [
    "jazzyfish",
    "unique",
    "human-friendly",
    "identifiers",
    "encoder",
    "decoder",
]
readme = { "file" = "README.md", "content-type" = "text/markdown" }
authors = [
    { name = "Mihai Bojin", email = "557584+MihaiBojin@users.noreply.github.com" },
]
dynamic = ["dependencies", "optional-dependencies", "version"]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
] # https://pypi.org/classifiers/

[project.urls]
"Bug reports" = "https://github.com/jazzy-fish/jazzy-fish/issues/new"
"Documentation" = "https://github.com/jazzy-fish/jazzy-fish/blob/main/python/README.md"
"Source" = "https://github.com/jazzy-fish/jazzy-fish"

[project.scripts]
clean-dictionary = "jazzy_fish_tools.clean_dictionary:main"
generate-wordlists = "jazzy_fish_tools.generate_wordlists:main"

[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[tool.hatch.build]
# https://git-scm.com/docs/gitignore#_pattern_format
exclude = [
    "Makefile",
    ".pypirc",
    "tests/**",
    "scripts/**",
    "!scripts/show-stats.bash",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jazzy_fish", "src/jazzy_fish_tools"]

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[tool.hatch.metadata.hooks.requirements_txt.optional-dependencies]
cli = ["requirements-cli.txt"]
dev = ["requirements-dev.txt"]

[tool.hatch.envs.venv]
type = "virtual"

[tool.hatch.version]
path = "./VERSION"
pattern = "(?P<version>.+)"

[tool.ruff.lint]
# Pin the rule set explicitly. Ruff's implicit defaults have widened over
# releases: upgrading the hook from 0.4 to 0.16 turned on hundreds of rules at
# once and surfaced 94 findings in code that had not changed. Stating the
# policy here means a ruff upgrade is a tooling bump, not a silent change to
# what counts as an error. Widen deliberately, not by upgrade.
select = ["E4", "E7", "E9", "F"]
